upstream nuxt {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name _;
    # 隐藏 nginx 版本号
    server_tokens off;

    # Docker 内置 DNS, 请求时才解析, 避免 server 未启动时 nginx 报错
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20m;

    # 基础安全响应头(生产前置 TLS 后建议追加 Strict-Transport-Security)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: 脚本/样式仅限同源与内联(Nuxt SSR 需要内联水合脚本); 外部源一律拒绝
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # API 请求反向代理到 Go 后端
    location /api/ {
        set $backend http://server:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件反向代理到 Go 后端
    location /upload/ {
        set $backend http://server:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余请求代理到 Nuxt
    location / {
        proxy_pass http://nuxt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
