upstream nuxt {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name _;
    # 隐藏 nginx 版本号
    server_tokens off;

    # 真实客户端 IP: 流量经宿主机上的外层代理进入容器 (源地址是 docker 网关),
    # realip 模块把 $remote_addr 还原为 XFF 里最后一条非受信来源的地址;
    # 客户端伪造的 XFF 头 (如 X-Forwarded-For: 127.0.0.1) 只会被当作链上的
    # 候选项, 因其真实来源是公网 IP 不在受信网段内, 不会被还原成 $remote_addr。
    # 受信范围只覆盖 docker 网段 (容器间/网关), 公网直连本容器时 realip 不生效。
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # X-Forwarded-Proto 用透传式 ($http_x_forwarded_proto): TLS 终止在真机层时
    # 把 https 一路带入容器与后端; 无外层代理时该头为空 (前后端均不依赖)。
    # 直接访问容器时客户端可伪造该头, 但只影响协议判定, 不影响客户端 IP。

    # Docker 内置 DNS, 请求时才解析, 避免 server 未启动时 nginx 报错
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20m;

    # 基础安全响应头(生产前置 TLS 后建议追加 Strict-Transport-Security)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: 脚本/样式仅限同源与内联(Nuxt SSR 需要内联水合脚本); 外部源一律拒绝
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # 消息 SSE 事件流: 关闭代理缓冲, 放宽读超时, 保证长连接实时下发
    location /api/v1/message/events {
        set $backend http://server:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # XFF 用覆盖式写入 $remote_addr (realip 已还原成真实客户端 IP):
        # 追加式会把客户端伪造的 XFF 前缀透传给后端, GoFrame 取 XFF 首元素会记错 IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # API 请求反向代理到 Go 后端
    location /api/ {
        set $backend http://server:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # XFF 用覆盖式写入 $remote_addr (realip 已还原成真实客户端 IP):
        # 追加式会把客户端伪造的 XFF 前缀透传给后端, GoFrame 取 XFF 首元素会记错 IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 上传文件反向代理到 Go 后端
    location /upload/ {
        set $backend http://server:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # XFF 用覆盖式写入 $remote_addr (realip 已还原成真实客户端 IP):
        # 追加式会把客户端伪造的 XFF 前缀透传给后端, GoFrame 取 XFF 首元素会记错 IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 其余请求代理到 Nuxt
    location / {
        proxy_pass http://nuxt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # XFF 用覆盖式写入 $remote_addr (realip 已还原成真实客户端 IP):
        # 追加式会把客户端伪造的 XFF 前缀透传给后端, GoFrame 取 XFF 首元素会记错 IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
