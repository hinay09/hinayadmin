# Docker 环境专用配置
# 通过环境变量 GF_GCFG_FILE=config.docker.yaml 指定加载此文件
# 该配置用于容器(生产)部署, 默认关闭 openapi/swagger/SQL 调试等调试面

server:
  address:     ":8000"
  # 生产环境不暴露 openapi/swagger 接口清单
  dumpRouterMap: false
  accessLogEnabled: true
  errorLogEnabled: true

logger:
  level : "all"
  stdout: true
  ctxKeys: ["RequestId"]

database:
  default:
    type:    "mysql"
    host:    "mysql"
    port:    "3306"
    user:    "root"
    pass:    "${MYSQL_ROOT_PASSWORD}"
    name:    "hinay_admin"
    charset: "utf8mb4"
    extra:  "collation=utf8mb4_unicode_ci"
    debug:   false

redis:
  default:
    address: "redis:6379"
    db:      0

# CORS 跨域来源白名单: 容器内由 nginx 同源反代, 无跨域需求, 保持为空
cors:
  allowOrigins: []

# 全局限流 (按客户端 IP 的令牌桶, 单实例内存态; 修改需重启)
ratelimit:
  enable: true
  rate: 100     # 每秒允许请求数(令牌补充速率)
  burst: 200    # 突发上限(桶容量)

# 网页版代码生成 (information_schema 读表 + 预览/zip 下载/直写源码树)
# 安全开关: 默认关闭; 直写要求服务实例运行于源码目录, 容器内自动拒绝。
gencode:
  enable: false

# 演示环境开关 (代码优先读环境变量 DEMO_MODE, 此处为未注入时的兜底):
# true 时全局禁止修改/重置密码, 并屏蔽登录后的强制改密引导
demo:
  enable: ${DEMO_MODE}

# JWT 配置 (secret 由环境变量 JWT_SECRET 注入, 未设置时启动脚本占位符保留, 服务拒绝启动)
jwt:
  secret:     "${JWT_SECRET}"
  expireSec:  86400
  issuer:     "hinay-admin"
  header:     "Authorization"

casbin:
  enable: true
  model: |
    [request_definition]
    r = sub, obj, act

    [policy_definition]
    p = sub, obj, act

    [role_definition]
    g = _, _

    [policy_effect]
    e = some(where (p.eft == allow))

    [matchers]
    m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && (r.act == p.act || p.act == "*")
