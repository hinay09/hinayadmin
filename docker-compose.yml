services:
  mysql:
    image: mariadb:11.8.8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hinay123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hinay_admin}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/manifest/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-hinay123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.0
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hinay123456}
      JWT_SECRET: ${JWT_SECRET:-hinay-admin-please-change-me}
      GF_GCFG_FILE: config.docker.yaml
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web_src
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mysql_data:
  redis_data:
